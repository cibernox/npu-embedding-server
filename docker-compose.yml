services:
  npu-embedding-server:
    image: ghcr.io/cibernox/npu-embedding-server:latest
    container_name: npu-embedding-server
    restart: unless-stopped
    devices:
      - /dev/accel/accel0:/dev/accel/accel0
    ports:
      - "8100:8100"
    volumes:
      - /root/embedding-models:/models
    environment:
      - OPENVINO_DEVICE=NPU
      # Start on the small bucket: queries are the hot path (50ms on 64 vs 282ms
      # on 512). Long chunks switch to 512 automatically during ingestion.
      - DEFAULT_BUCKET=64
      - POOLING=last_token
      - PORT=8100
      # Required if this is reachable from outside the LAN. Unset = no auth.
      - API_KEY=${NPU_EMBEDDING_API_KEY:-}
